# Configuration for KPConv Contrastive Learning on HarvardForest3D
# PointContrast-style self-supervised pretraining
# Use this to pretrain on unlabeled HarvardForest data with Semantic3D initialization

dataset:
  name: HarvardForest3DContrastive
  dataset_path: /home/fzhcis/mylab/data/HarvardForest  # UPDATE THIS PATH
  cache_dir: ./logs/cache_harvardforest_contrast_kpconv/
  num_points: 8192  # Points per cloud sample
  test_result_folder: ./test
  use_cache: false
  val_split_ratio: 0.1
  val_split_seed: 42
  test_split_ratio: 0.0  # No test set for SSL
  use_intensity: false  # Set to true if using intensity features
  use_rgb: false  # Set to true if using RGB features
  
  # Augmentation parameters for contrastive learning
  augment_rotation_range: 360  # Full rotation around Z-axis (0-360 degrees)
  augment_scale_min: 0.8  # Minimum scaling factor
  augment_scale_max: 1.2  # Maximum scaling factor
  augment_jitter_std: 0.01  # Gaussian noise std deviation
  augment_dropout_ratio: 0.2  # Randomly drop 20% of points
  augment_translate_range: 0.5  # Random translation ±0.5m
  
  # Correspondence parameters
  correspondence_threshold: 0.05  # 5cm threshold for matching
  min_correspondences: 512  # Minimum correspondences per pair

model:
  name: KPConvContrast
  batcher: ConcatBatcher
  
  # Path to pretrained KPConv encoder from Semantic3D (if available)
  # Leave commented out if training from scratch
  # pretrained_encoder_path: /path/to/kpconv_semantic3d_checkpoint.pth
  pretrained_encoder_path: null
  load_encoder_strict: false  # Allow partial loading
  freeze_encoder_epochs: 10  # Freeze encoder for first 10 epochs (warmup)
  encoder_lr_scale: 0.1  # Encoder LR = base_lr * 0.1
  
  # KPConv encoder architecture
  num_classes: 1  # Dummy for contrastive learning
  ignored_label_inds: []
  architecture: [
    'simple',
    'resnetb', 'resnetb_strided',
    'resnetb', 'resnetb',
    'resnetb_strided',
    'resnetb', 'resnetb',
    'resnetb_strided',
    'resnetb', 'resnetb',
    'resnetb_strided',
    'resnetb'
  ]
  in_radius: 4.0
  max_in_points: 100000
  batch_num: 8
  batch_limit: 30000
  val_batch_num: 8
  num_kernel_points: 15
  first_subsampling_dl: 0.06  # First subsampling distance (voxel size)
  conv_radius: 2.5
  first_features_dim: 128  # Base feature dimension
  in_features_dim: 1  # Input features (1 for XYZ only, 2 for XYZ+intensity)
  
  # Projection head parameters
  projection_hidden_dims: [512, 256]  # MLP hidden dimensions
  projection_output_dim: 128  # Final embedding dimension
  projection_use_bn: true  # Use batch normalization
  projection_dropout: 0.1  # Dropout rate

pipeline:
  name: ContrastiveLearning
  
  # Optimizer settings
  learning_rate: 0.001  # Base learning rate (for projection head)
  # Encoder will use: learning_rate * encoder_lr_scale = 0.0001
  weight_decay: 0.0001
  scheduler_gamma: 0.99  # Exponential LR decay per epoch
  
  # Training settings
  batch_size: 4  # KPConv is more memory intensive
  val_batch_size: 4
  test_batch_size: 4
  num_workers: 0  # Parallel data loading
  max_epoch: 100  # Total training epochs
  save_ckpt_freq: 10  # Save checkpoint every N epochs
  
  # Contrastive learning parameters
  temperature: 0.07  # Temperature for InfoNCE loss (0.05-0.1 typical)
  freeze_encoder_epochs: 10  # Match model.freeze_encoder_epochs
  
  # Logging
  main_log_dir: ./logs
  train_sum_dir: contrastive_logs/kpconv_harvardforest_contrast/

# Training strategy:
# Epochs 0-9: Warmup phase
#   - Encoder frozen (use pretrained weights if available, else random init)
#   - Train only projection head
#   - Learning rate: 0.001 (projection head)
#
# Epochs 10-99: Fine-tuning phase
#   - Encoder unfrozen
#   - Train full model end-to-end
#   - Learning rates: 0.0001 (encoder), 0.001 (projection head)
#   - LR decays exponentially with gamma=0.99

# Notes:
# - KPConv is more computationally expensive than RandLANet
# - Reduce batch_size if GPU memory is insufficient
# - KPConv may provide better features for forest scenes due to
#   its robustness to varying point densities
# - Longer warmup (10 epochs) recommended for KPConv

# Expected performance:
# - InfoNCE loss should decrease steadily
# - Contrastive accuracy should increase to 70-90%
# - Training time: ~8-16 hours (100 epochs, batch_size=4, 1 GPU)

# After training:
# - Use trained encoder for downstream tasks
# - KPConv features often transfer better than RandLANet for complex scenes
# - Fine-tune on labeled subset for semantic segmentation
