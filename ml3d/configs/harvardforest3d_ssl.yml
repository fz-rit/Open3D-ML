dataset:
  name: HarvardForest3D
  dataset_path: /home/fzhcis/mylab/data/HarvardForest  # UPDATE THIS PATH
  cache_dir: ./logs/cache_harvardforest/
  num_points: 65536
  test_result_folder: ./test
  use_cache: true
  val_split_ratio: 0.1
  val_split_seed: 42
  test_split_ratio: 0.0  # No separate test set
  use_intensity: true
  use_rgb: false  # Set to true if LAS files have RGB
  class_weights: null  # Not used for SSL
  ignored_label_inds: []
  steps_per_epoch_train: null  # Use full epoch
  steps_per_epoch_valid: null

model:
  name: RandLANetSSL
  batcher: DefaultBatcher
  # Path to pretrained RandLANet encoder from Semantic3D
  pretrained_encoder_path: /home/fzhcis/mylab/data/semantic3d/open3d_randlanet/test_1027/ckpt_00400.pth
  load_encoder_strict: false
  freeze_encoder_epochs: 5  # Freeze encoder for first 5 epochs (warmup)
  
  # SSL task configuration
  ssl_task: rotation
  num_rotation_classes: 4  # 0°, 90°, 180°, 270°
  ssl_head_dims: [256, 128]  # MLP hidden dims for rotation classifier
  dropout_rate: 0.5
  
  # RandLANet encoder architecture (match Semantic3D)
  num_neighbors: 16
  num_layers: 5
  num_points: 65536
  sub_sampling_ratio: [4, 4, 4, 4, 2]
  in_channels: 4  # XYZ + intensity (adjust if using RGB: 7)
  dim_features: 8
  dim_output: [16, 64, 128, 256, 512]
  grid_size: 0.06
  
  # Augmentations (keep same as Semantic3D for consistency)
  augment:
    recenter:
      dim: [0, 1]  # Center XY only, preserve Z
    normalize:
      feat:
        method: linear
        bias: 0
        scale: 1.0  # Intensity already normalized in dataset
    scale:
      min_s: 0.95
      max_s: 1.05
    noise:
      noise_std: 0.001
    # Note: rotation augmentation is handled by SSL pipeline

pipeline:
  name: SSLRotation
  
  # Optimizer settings
  learning_rate: 0.001  # Head learning rate
  encoder_lr: 0.0001  # Encoder learning rate (10x smaller)
  weight_decay: 0.0001
  scheduler_gamma: 0.995
  
  # Training settings
  batch_size: 4  # Adjust based on GPU memory
  val_batch_size: 4
  test_batch_size: 4
  num_workers: 4  # Parallel data loading
  max_epoch: 50  # Start with 50, increase if needed
  save_ckpt_freq: 20
  
  # SSL rotation settings
  num_rotation_classes: 4
  rotation_axis: z  # Rotate around vertical axis (natural for forest scenes)
  freeze_encoder_epochs: 5  # Warmup period
  
  # Logging
  main_log_dir: ./logs
  train_sum_dir: train_log
  
  summary:
    record_for: []
    max_pts: null
    use_reference: false
    max_outputs: 1
