dataset:
  name: Semantic3DUnified
  dataset_path: /shared/rc/mangrove/data/Semantic3D/all_remapped/
  cache_dir: ./logs/cache_semantic3dunified_grid06/
  class_weights: [8094, 14, 1981, 1969]
  test_result_folder: ./test
  use_cache: true
  # Dynamic split ratios (must sum to 1.0)
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  split_seed: 42
  
  # DATALOADER ITERATIONS CONFIGURATION
  # Number of weight updates (batches) per epoch.
  # Formula: iterations = (coverage_ratio × total_points) / (batch_size × num_points)
  # Example: (3.0 × 48000k) / (24 × 40k) =  150 iterations/epoch
  dataloader_iterations_per_epoch_train: 120
  dataloader_iterations_per_epoch_valid: 10
  sampler:
    name: 'SemSegRandomSampler'
model:
  name: RandLANet
  batcher: DefaultBatcher
  # ckpt_path: /home/fzhcis/mylab/Open3D-ML/logs/RandLANet_Semantic3DUnified_torch/checkpoint/model_epoch0070_2025-12-03_22-50-31.pth
  ckpt_path: /home/fzhcis/mylab/Open3D-ML/logs/RandLANet_Semantic3DUnified_torch/checkpoint/best_model_epoch0019_2025-12-11_03-19-49.pth
  num_neighbors: 16
  num_layers: 5
  num_points: 40960
  num_classes: 4
  ignored_label_inds: [0]
  sub_sampling_ratio: [4, 4, 4, 4, 2]
  in_channels: 3
  dim_features: 8
  dim_output: [16, 64, 128, 256, 512]
  grid_size: 0.06
  is_resume: false
  augment:
    recenter:
      dim: [0, 1]
    normalize:
      feat:
        method: linear
        bias: 0
        scale: 255
    rotate:
      method: vertical
    scale:
      min_s: 0.9
      max_s: 1.1
    noise:
      noise_std: 0.001
pipeline:
  name: SemanticSegmentation
  optimizer:
    lr: 0.001
  batch_size: 24
  num_workers: 0
  main_log_dir: /home/fzhcis/mylab/Open3D-ML/logs
  max_epoch: 100
  scheduler_gamma: 0.995
  # test_batch_size: 24
  train_sum_dir: train_log
  val_batch_size: 24
  save_ckpt_freq: 10
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001
    monitor: 'val_iou'
  summary:
    record_for: []
    max_pts:
    use_reference: false
    max_outputs: 1
