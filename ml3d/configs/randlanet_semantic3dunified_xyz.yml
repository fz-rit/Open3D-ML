dataset:
  name: Semantic3DUnified
  dataset_path: /home/fzhcis/data/semantic3d_full/Semantic3D
  cache_dir: ./logs/cache_semantic3dunified/
  class_weights: [250789, 2377612, 20488, 179050, 196894, 1173042]
  ignored_label_inds: [0]
  num_points: 65536
  test_result_folder: ./test
  use_cache: true
  val_files:
  - domfountain_station1_xyz_intensity_rgb
  - bildstein_station1_xyz_intensity_rgb
  steps_per_epoch_train: 30
  steps_per_epoch_valid: 10
model:
  name: RandLANet
  batcher: DefaultBatcher
  ckpt_path: 
  num_neighbors: 16
  num_layers: 5
  num_points: 65536
  num_classes: 6
  ignored_label_inds: [0]
  sub_sampling_ratio: [4, 4, 4, 4, 2]
  in_channels: 3
  dim_features: 8
  dim_output: [16, 64, 128, 256, 512]
  grid_size: 0.06
  augment:
    recenter:
      dim: [0, 1]
    normalize:
      feat:
        method: linear
        bias: 0
        scale: 255
    rotate:
      method: vertical
    scale:
      min_s: 0.9
      max_s: 1.1
    noise:
      noise_std: 0.001
pipeline:
  name: SemanticSegmentation
  optimizer:
    lr: 0.001
  batch_size: 4
  num_workers: 4
  main_log_dir: ./logs
  max_epoch: 5
  save_ckpt_freq: 50
  scheduler_gamma: 0.995
  is_resume: false
  test_batch_size: 4
  train_sum_dir: train_log
  val_batch_size: 4
  summary:
    record_for: []
    max_pts:
    use_reference: false
    max_outputs: 1
