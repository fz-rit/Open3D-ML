dataset:
  name: Semantic3D
  dataset_path: /home/fzhcis/mylab/data/semantic3d/open3d_randlanet/test_1027
  cache_dir: ./logs/cache_semantic3d/
  class_weights: [796491240, 480979247, 135634808, 99971504, 285746986, 83466776, 51979924, 609275]
  ignored_label_inds: [0]
  num_points: 65536
  test_result_folder: ./test
