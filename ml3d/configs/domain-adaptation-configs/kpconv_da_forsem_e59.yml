# Domain Adaptation Configuration: KPConv (KPFCNN)
# Source: Semantic3DUnified (labeled)
# Target: ForestSemantic (unlabeled for training)

source_dataset:
  name: Semantic3DUnified
  dataset_path: /shared/rc/mangrove/data/Semantic3D/all_remapped/
  cache_dir: ./logs/cache_semantic3dunified_grid06/
  class_weights: [8094, 14, 1981, 1969]
  ignored_label_inds: [0]
  use_cache: true
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  split_seed: 42
  dataloader_iterations_per_epoch_train: 50
  dataloader_iterations_per_epoch_valid: 10

target_dataset:
  name: ForestSemantic
  dataset_path: /shared/rc/mangrove/data/ForestSemantic/
  cache_dir: ./logs/cache_forestsemantic_grid06/
  class_weights: [2377612, 20488, 179050, 196894]
  # num_points: 10240
  use_cache: true

model:
  name: KPFCNNDA
  batcher: ConcatBatcher
  ckpt_path: /home/fzhcis/mylab/Open3D-ML/logs/KPFCNN_Semantic3DUnified_torch/checkpoint/best_model_epoch0059_2025-12-11_22-12-37.pth
  
  # KPConv architecture
  num_classes: 4
  ignored_label_inds: [0]
  lbl_values: [0, 1, 2, 3, 4]  # REQUIRED: Must match pretrained checkpoint!
  in_features_dim: 3
  in_points_dim: 3
  in_radius: 6.0
  architecture:
    - simple
    - resnetb
    - resnetb_strided
    - resnetb
    - resnetb_strided
    - resnetb
    - resnetb_strided
    - resnetb
    - resnetb_strided
    - resnetb
    - nearest_upsample
    - unary
    - nearest_upsample
    - unary
    - nearest_upsample
    - unary
    - nearest_upsample
    - unary
  
  # KPConv parameters
  num_kernel_points: 15
  num_layers: 5
  first_subsampling_dl: 0.06
  conv_radius: 2.5
  deform_radius: 6.0
  KP_extent: 1.2
  KP_influence: linear
  aggregation_mode: sum
  first_features_dim: 128
  use_batch_norm: true
  batch_norm_momentum: 0.98
  modulated: false
  density_parameter: 5.0
  fixed_kernel_points: center
  
  # Deformable convolution parameters
  deform_fitting_mode: point2point
  deform_fitting_power: 1.0
  repulse_extent: 1.2
  
  # Batch parameters
  batch_limit: 1000000
  min_in_points: 10240
  max_in_points: 40960
  
  # Augmentation
  augment_scale_anisotropic: true
  augment_symmetries: [true, false, false]
  augment_rotation: vertical
  augment_scale_min: 0.9
  augment_scale_max: 1.1
  augment_noise: 0.001
  augment_color: 1.0
  
  # Domain adaptation settings
  return_features: true
  alignment_layers: [0, 3, 6, 9]  # Align at multiple depths
  is_resume: true

pipeline:
  name: DomainAdaptationSemanticSegmentation
  
  # Domain adaptation parameters - EMA-based adaptive weighting
  # NOTE: coral_weight, progressive_steps, min_weight_ratio are IGNORED with EMA strategy
  # The adaptive weight is automatically calculated as: seg_loss_ema / coral_loss_ema
  coral_weight: 1.0        # Not used (kept for compatibility)
  progressive_steps: 200   # Not used (kept for compatibility)
  min_weight_ratio: 0.1    # Not used (kept for compatibility)
  alignment_layers: [0, 3, 6, 9]  # MUST match model.alignment_layers!
  layer_weights: [0.2, 0.25, 0.25, 0.3]  # Progressive weighting (4 layers)
  use_geodesic: false
  coral_loss_type: adaptive
  num_target_validate_batch: 10   # Target validation batches per epoch (0 disables)
  debug_coral_loss: false  # Enable detailed CORAL loss debugging on first iteration
  
  # Standard training parameters
  optimizer:
    lr: 0.0001
  learning_rate: 0.0001  # KPConv uses this parameter name
  deform_lr_factor: 0.1  # Deformable conv learning rate = lr * 0.1
  momentum: 0.98
  weight_decay: 0.0001
  batch_size: 8
  num_workers: 0
  main_log_dir: ./logs
  max_epoch: 100
  scheduler_gamma: 0.995
  grad_clip_norm: 10.0  # Prevent gradient explosion
  # test_batch_size: 24
  train_sum_dir: train_log
  val_batch_size: 16
  save_ckpt_freq: 5
  monitor_freq: 3           # Encoder domain alignment monitoring frequency
  decoder_monitor_freq: 3   # Decoder class distribution monitoring frequency
  pin_memory: true
  enable_tsne: false 
  enable_umap: false 
  
  early_stopping:
    enabled: true
    patience: 5
    min_delta: 0.001
    monitor: 'val_iou'
  
  summary:
    record_for: []
    max_pts:
    use_reference: false
    max_outputs: 1
