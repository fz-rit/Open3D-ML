# Domain Adaptation Configuration: RandLANet [FULL MODE]
# Source: Semantic3DUnified (labeled)
# Target: DigiForestUnified (unlabeled for training)
# Purpose: Best performance, production-quality model (30-60 min per epoch)

source_dataset:
  name: Semantic3DUnified
  dataset_path: /shared/rc/mangrove/data/Semantic3D/all_remapped/
  cache_dir: ./logs/cache_semantic3dunified/
  class_weights: [8094, 14, 1981, 1969]
  ignored_label_inds: [0]
  num_points: 10240
  test_result_folder: ./test
  use_cache: true
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  split_seed: 42
  steps_per_epoch_train: 128
  steps_per_epoch_valid: 64
  sampler:
    name: 'SemSegRandomSampler'

target_dataset:
  name: DigiForestUnified
  dataset_path: /home/fzhcis/data/DigiForests/aggregate_outputs/semantics_cleaned
  labels_path: /home/fzhcis/data/DigiForests/aggregate_outputs/digiforests_remapped_labels
  cache_dir: ./logs/cache_digiforestunified_da/
  class_weights: [66, 37, 58, 74]
  ignored_label_inds: [0]
  num_points: 10240
  test_result_folder: ./test_digiforest
  use_cache: true
  sampler:
    name: 'SemSegRandomSampler'

model:
  name: RandLANetDA
  batcher: DefaultBatcher
  ckpt_path: /home/fzhcis/mylab/Open3D-ML/logs/RandLANet_Semantic3DUnified_torch/checkpoint/model_epoch0090_2025-12-06_20-52-28.pth
  num_neighbors: 128
  num_layers: 5
  num_points: 10240
  num_classes: 4
  ignored_label_inds: [0]
  sub_sampling_ratio: [4, 4, 4, 4, 2]
  in_channels: 3
  dim_features: 8
  dim_output: [16, 64, 128, 256, 512]
  grid_size: 0.06
  return_features: true
  is_resume: true
  alignment_layers: [0, 2, 4]  # FULL: Multi-level alignment (tune based on pilot)
  augment:
    recenter:
      dim: [0, 1]
    normalize:
      feat:
        method: linear
        bias: 0
        scale: 255
    rotate:
      method: vertical
    scale:
      min_s: 0.9
      max_s: 1.1
    noise:
      noise_std: 0.001

pipeline:
  name: DomainAdaptationSemanticSegmentation
  
  # Domain adaptation parameters - FULL settings (tune based on pilot results)
  coral_weight: 50  # Adjust based on pilot: 0.05 if source drops, 0.2-0.5 if target needs boost
  progressive_steps: 3000  # FULL: Smooth ramp-up
  alignment_layers: [0, 2, 4]  # Must match model
  layer_weights: [0.2, 0.3, 0.5]  # Progressive weighting
  use_geodesic: true
  coral_loss_type: adaptive
  
  # Standard training parameters
  optimizer:
    lr: 0.0005  # May reduce to 0.0003 if unstable
  batch_size: 8  # Increase to 16 if memory allows
  num_workers: 8
  main_log_dir: ./logs
  max_epoch: 150  # FULL: Train to convergence
  scheduler_gamma: 0.995
  grad_clip_norm: 1.0  # Prevent gradient explosion
  test_batch_size: 16
  train_sum_dir: train_log
  val_batch_size: 16
  save_ckpt_freq: 10
  monitor_freq: 10  # Run domain monitoring every 10 epochs
  enable_tsne: true  # Enable t-SNE for detailed monitoring in full runs
  enable_umap: true   # Keep UMAP for full mode analysis
  
  early_stopping:
    enabled: true
    patience: 40
    min_delta: 0.001
    monitor: 'val_iou'
  
  summary:
    record_for: []
    max_pts:
    use_reference: false
    max_outputs: 1
