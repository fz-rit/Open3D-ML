# Domain Adaptation Configuration: RandLANet [DEBUG MODE]
# Source: Semantic3DUnified (labeled)
# Target: DigiForestUnified (unlabeled for training)
# Purpose: Fast iteration to verify pipeline works (1-2 min per epoch)

source_dataset:
  name: Semantic3DUnified
  dataset_path: /shared/rc/mangrove/data/Semantic3D/all_remapped/
  cache_dir: ./logs/cache_semantic3dunified/
  class_weights: [8094, 14, 1981, 1969]
  ignored_label_inds: [0]
  num_points: 10240
  test_result_folder: ./test
  use_cache: true
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  split_seed: 42
  steps_per_epoch_train: 15  # DEBUG: Fast iteration
  steps_per_epoch_valid: 5

target_dataset:
  name: DigiForestUnified
  dataset_path: /home/fzhcis/data/DigiForests/aggregate_outputs/semantics_cleaned
  labels_path: /home/fzhcis/data/DigiForests/aggregate_outputs/digiforests_remapped_labels
  cache_dir: ./logs/cache_digiforestunified/
  class_weights: [66, 37, 58, 74]
  ignored_label_inds: [0]
  num_points: 10240
  test_result_folder: ./test_digiforest
  use_cache: false

model:
  name: RandLANetDA
  batcher: DefaultBatcher
  ckpt_path: /home/fzhcis/mylab/Open3D-ML/logs/RandLANet_Semantic3DUnified_torch/checkpoint/model_epoch0070_2025-12-03_22-50-31.pth
  num_neighbors: 128
  num_layers: 5
  num_points: 10240
  num_classes: 4
  ignored_label_inds: [0]
  sub_sampling_ratio: [4, 4, 4, 4, 2]
  in_channels: 3
  dim_features: 8
  dim_output: [16, 64, 128, 256, 512]
  grid_size: 0.06
  return_features: true
  is_resume: true
  alignment_layers: [4]  # DEBUG: Single deepest layer only
  augment:
    recenter:
      dim: [0, 1]
    normalize:
      feat:
        method: linear
        bias: 0
        scale: 255
    rotate:
      method: vertical
    scale:
      min_s: 0.9
      max_s: 1.1
    noise:
      noise_std: 0.001

pipeline:
  name: DomainAdaptationSemanticSegmentation
  
  # Domain adaptation parameters - DEBUG settings
  coral_weight: 0.1
  progressive_steps: 50  # DEBUG: Fast ramp-up
  alignment_layers: [4]  # Must match model
  layer_weights: [1.0]  # Single layer
  use_geodesic: true
  coral_loss_type: adaptive
  target_labeled_ratio: 0.0
  
  # Standard training parameters
  optimizer:
    lr: 0.0005
  batch_size: 2  # DEBUG: Smaller batch for faster iteration
  num_workers: 0
  main_log_dir: ./logs
  max_epoch: 3  # DEBUG: Just verify it runs
  scheduler_gamma: 0.995
  grad_clip_norm: 1.0  # Prevent gradient explosion
  test_batch_size: 4
  train_sum_dir: train_log
  val_batch_size: 4
  save_ckpt_freq: 1  # Save every epoch for debugging
  monitor_freq: 1  # Run domain monitoring every epoch (debug mode)
  enable_tsne: false  # Disable expensive t-SNE in debug mode
  enable_umap: false  # Disable expensive UMAP in debug mode
  
  early_stopping:
    enabled: false  # Disabled for debugging
  
  summary:
    record_for: []
    max_pts:
    use_reference: false
    max_outputs: 1
