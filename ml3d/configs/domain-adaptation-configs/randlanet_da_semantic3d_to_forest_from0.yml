# Domain Adaptation Configuration: RandLANet [FULL MODE]
# Source: Semantic3DUnified 
# Target: ForestSemantic 

source_dataset:
  name: Semantic3DUnified
  dataset_path: /shared/rc/mangrove/data/Semantic3D/all_remapped/
  cache_dir: ./logs/cache_semantic3dunified_grid06/
  class_weights: [8094, 14, 1981, 1969]
  ignored_label_inds: [0]
  use_cache: true
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  split_seed: 42
  dataloader_iterations_per_epoch_train: 10
  dataloader_iterations_per_epoch_valid: 5
  # sampler:
  #   name: 'SemSegRandomSampler'

target_dataset:
  name: ForestSemantic
  dataset_path: /shared/rc/mangrove/data/ForestSemantic/
  cache_dir: ./logs/cache_forestsemantic_grid06/
  class_weights: [2377612, 20488, 179050, 196894]
  ignored_label_inds: [0]
  use_cache: true
  # sampler:
  #   name: 'SemSegRandomSampler'

model:
  name: RandLANetDA
  batcher: DefaultBatcher
  ckpt_path: /home/fzhcis/mylab/Open3D-ML/logs/RandLANet_Semantic3DUnified_torch/checkpoint/best_model_epoch0019_2025-12-11_03-19-49.pth
  num_neighbors: 16
  num_layers: 5
  num_points: 40960  # Match dataset num_points
  num_classes: 4
  ignored_label_inds: [0]
  sub_sampling_ratio: [4, 4, 4, 4, 2]
  in_channels: 3
  dim_features: 8
  dim_output: [16, 64, 128, 256, 512]
  grid_size: 0.06
  return_features: true
  alignment_layers: [0, 2, 4]  # FULL: Multi-level alignment (tune based on pilot)
  is_resume: false
  augment:
    recenter:
      dim: [0, 1]
    normalize:
      feat:
        method: linear
        bias: 0
        scale: 255
    rotate:
      method: vertical
    scale:
      min_s: 0.9
      max_s: 1.1
    noise:
      noise_std: 0.001

pipeline:
  name: DomainAdaptationSemanticSegmentation
  
  # Domain adaptation parameters - EMA-based adaptive weighting
  # NOTE: coral_weight, progressive_steps, min_weight_ratio are IGNORED with EMA strategy
  # The adaptive weight is automatically calculated as: seg_loss_ema / coral_loss_ema
  coral_weight: 1.0        # Not used (kept for compatibility)
  progressive_steps: 200   # Not used (kept for compatibility)
  min_weight_ratio: 0.1    # Not used (kept for compatibility)
  alignment_layers: [0, 2, 4]  # Must match model
  layer_weights: [0.2, 0.3, 0.5]  # Progressive weighting
  use_geodesic: false
  coral_loss_type: adaptive
  num_target_validate_batch: 10   # Target validation batches per epoch (0 disables)
  debug_coral_loss: false  # Enable detailed CORAL loss debugging on first iteration
  
  # Standard training parameters
  optimizer:
    lr: 0.001
  batch_size: 12
  num_workers: 0
  main_log_dir: ./logs
  max_epoch: 200
  scheduler_gamma: 0.995
  grad_clip_norm: 10.0  # Prevent gradient explosion
  test_batch_size: 24
  train_sum_dir: train_log
  val_batch_size: 24
  save_ckpt_freq: 5
  monitor_freq: 3           # Encoder domain alignment monitoring frequency
  decoder_monitor_freq: 3   # Decoder class distribution monitoring frequency
  pin_memory: false
  enable_tsne: true 
  enable_umap: true 
  
  early_stopping:
    enabled: true
    patience: 10
    min_delta: 0.001
    monitor: 'val_iou'
  
  summary:
    record_for: []
    max_pts:
    use_reference: false
    max_outputs: 1
