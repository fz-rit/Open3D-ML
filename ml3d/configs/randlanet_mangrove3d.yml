dataset:
  name: Mangrove3D
  dataset_path: /home/fzhcis/data/mangrove3d_pcd/
  cache_dir: ./logs/cache_mangrove3d/
  class_weights: [12348000, 10424000, 61446000, 1790000, 373000]
  ignored_label_inds: []
  num_points: 65536
  test_result_folder: ./test
  use_cache: true 
  # Deterministic random split; 0.1 means 10% validation
  val_split_ratio: 0.1
  val_split_seed: 42
  # Mangrove3D-specific options
  use_features: true
  feature_first_col: nx
  feature_last_col: nz
  pcd_dir_name: pcd
  label_dir_name: label
  # Label handling:
  # - Files contain 1-based labels (1,2,3,4,5)
  # - Automatically converted to 0-based (0,1,2,3,4) internally for training
  # - Converted back to 1-based (1,2,3,4,5) when saving predictions
  # Class names are mapped to 0-based indices for internal use
  label_to_names:
    0: Ground_and_water
    1: Stem
    2: Canopy
    3: Roots
    4: Object

model:
  name: RandLANet
  batcher: DefaultBatcher
  ckpt_path:  /home/fzhcis/mylab/Open3D-ML/scripts/run_tests_fei/logs/RandLANet_Mangrove3D_torch/checkpoint/ckpt_00100.pth
  num_neighbors: 16
  num_layers: 5
  num_points: 65536
  # Set num_classes to the actual number of classes
  num_classes: 5
  ignored_label_inds: []
  sub_sampling_ratio: [4, 4, 4, 4, 2]
  # Input channels: if using features from rangemeter..PCA3, count the columns
  # Columns include: rangemeter, Intensity, elevation, curvature, anisotropy, planarity,
  # nx, ny, nz, intensity_adjusted, z_adjusted, range_adjusted, Pseudo-Rn, Pseudo-Gn, Pseudo-Bn, PCA1, PCA2, PCA3
  # Set an estimate; revise after confirming exact column count
  # Input channels must equal 3 (XYZ) + number of selected feature columns
  in_channels: 6
  dim_features: 8
  dim_output: [16, 64, 128, 256, 512]
  grid_size: 0.03
  augment:
    recenter:
      dim: [0, 1]
    normalize:
      feat:
        method: linear
        bias: 0
        scale: 255
    rotate:
      method: vertical
    scale:
      min_s: 0.9
      max_s: 1.1
    noise:
      noise_std: 0.001

pipeline:
  name: SemanticSegmentation
  optimizer:
    lr: 0.001
  batch_size: 4
  num_workers: 0  # Must be 0: sampler contains unpicklable local functions
  main_log_dir: ./logs
  max_epoch: 250
  save_ckpt_freq: 5
  scheduler_gamma: 0.9886
  test_batch_size: 2
  train_sum_dir: train_log
  val_batch_size: 2
  summary:
    record_for: []
    max_pts:
    use_reference: false
    max_outputs: 1
